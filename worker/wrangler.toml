# Cloudflare Worker config — this Worker IS the "stateless serverless function".
# After `wrangler d1 create sla-db`, paste the printed database_id below.
name = "sla-monitor"
main = "src/index.ts"
compatibility_date = "2025-06-01"

# D1 binding — available in code as `env.DB`.
[[d1_databases]]
binding = "DB"
database_name = "sla-db"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"

[observability]
enabled = true
